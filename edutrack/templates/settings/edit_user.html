{% extends "base.html" %}
{% block title %}Edit User — EduTrack{% endblock %}
{% block content %}
<div class="page">
  <div class="flex-row mb-2">
    <a href="{{ url_for('settings.index') }}" class="btn btn-ghost btn-sm">← Back</a>
    <div class="page-title" style="margin-bottom:0">Edit User</div>
  </div>
  {% if error %}<div class="alert alert-error">❌ {{ error }}</div>{% endif %}
  <div class="card">
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input class="form-control" type="text" name="full_name" value="{{ target.full_name }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" type="text" name="username" value="{{ target.username }}" required>
        </div>
        <div class="form-group">
          <label class="form-label">Role</label>
          <select class="form-control" name="role">
            <option value="subject_teacher" {% if target.role=='subject_teacher' %}selected{% endif %}>Subject Teacher</option>
            <option value="class_teacher"   {% if target.role=='class_teacher'   %}selected{% endif %}>Class Teacher</option>
            <option value="principal"       {% if target.role=='principal'       %}selected{% endif %}>Principal</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
