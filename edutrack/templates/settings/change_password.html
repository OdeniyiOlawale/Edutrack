{% extends "base.html" %}
{% block title %}Change Password — EduTrack{% endblock %}
{% block content %}
<div class="page">
  <div class="flex-row mb-2">
    <a href="{{ url_for('settings.index') }}" class="btn btn-ghost btn-sm">← Back</a>
    <div class="page-title" style="margin-bottom:0">Change Password</div>
  </div>
  {% if error %}<div class="alert alert-error">❌ {{ error }}</div>{% endif %}
  <div class="card">
    <div class="card-header">
      <span class="card-title">{{ target.full_name }}</span>
      <span class="text-xs text-muted">@{{ target.username }}</span>
    </div>
    <div class="card-body">
      <form method="POST">
        <div class="form-group">
          <label class="form-label">New Password</label>
          <input class="form-control" type="password" name="new_password" placeholder="Minimum 6 characters" required>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm New Password</label>
          <input class="form-control" type="password" name="confirm_password" placeholder="Repeat password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Update Password</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
